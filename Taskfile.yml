version: '3'

tasks:
  default:
    desc: Build everything (Server, Pi Binary, Web, Android App)
    deps: [build-server, build-pi, build-web, build-android]

  build-server:
    desc: Build the Go server for local development
    sources:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
    generates:
      - goleds
    cmds:
      - go build -o goleds .

  build-pi:
    desc: Cross-compile the Go server for Raspberry Pi (ARMv7 and ARM64)
    sources:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
    generates:
      - goleds.armv7
      - goleds.arm64
    cmds:
      - GOOS=linux GOARCH=arm GOARM=7 go build -o goleds.armv7 .
      - GOOS=linux GOARCH=arm64 go build -o goleds.arm64 .
      - echo "Raspberry Pi binaries built as ./goleds.armv7 and ./goleds.arm64"

  generate-icons:
    desc: Generate app icons from SVG source
    sources:
      - "mobile/assets/icon.svg"
    generates:
      - "mobile/assets/icon.png"
    cmds:
      - convert -background none -resize 1024x1024 mobile/assets/icon.svg mobile/assets/icon.png
      - cd mobile && dart run flutter_launcher_icons

  build-web:
    desc: Build Flutter Web app and deploy to ./web
    deps: [generate-icons]
    sources:
      - "mobile/lib/**/*.dart"
      - "mobile/pubspec.yaml"
      - "mobile/pubspec.lock"
      - "mobile/web/**/*"
    generates:
      - "web/index.html"
    cmds:
      - cd mobile && flutter build web --release --no-wasm-dry-run
      - rm -rf web
      - mkdir -p web
      - cp -r mobile/build/web/* web/
      - echo "Web build deployed to ./web"

  build-android:
    desc: Build Flutter Android Split APKs
    deps: [generate-icons]
    sources:
      - "mobile/lib/**/*.dart"
      - "mobile/pubspec.yaml"
      - "mobile/pubspec.lock"
      - "mobile/android/build.gradle.kts"
      - "mobile/android/settings.gradle.kts"
      - "mobile/android/app/build.gradle.kts"
      - "mobile/android/app/src/**/*"
    generates:
      - "goleds_commander_arm64-v8a.apk"
      - "goleds_commander_armeabi-v7a.apk"
      - "goleds_commander_x86_64.apk"
      - "goleds_commander.apk"
    cmds:
      - cd mobile && flutter build apk --release --split-per-abi
      - cp mobile/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk goleds_commander_arm64-v8a.apk
      - cp mobile/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk goleds_commander_armeabi-v7a.apk
      - cp mobile/build/app/outputs/flutter-apk/app-x86_64-release.apk goleds_commander_x86_64.apk
      - cp goleds_commander_arm64-v8a.apk goleds_commander.apk
      - echo "Split APKs copied to root"

  install-android:
    desc: Build Android APK and install modern 64-bit ARM APK on connected device via adb
    deps: [build-android]
    cmds:
      - adb install -r goleds_commander_arm64-v8a.apk
      - echo "Installed goleds_commander_arm64-v8a.apk on connected device via adb"

  clean:
    desc: Clean all artifacts
    cmds:
      - rm -f goleds goleds.arm* goleds_pi goleds_commander*.apk
      - rm -rf web
      - cmd: cd mobile && flutter clean
        ignore_error: true
